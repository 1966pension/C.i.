<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수익률이 다르면 합계금액은?</title>
<meta name="description" content="매월 같은 금액을 납입할 때 연 수익률 4%·6%·8%·10%에 따라 합계금액이 어떻게 달라지는지 비교합니다.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="수익률이 다르면 합계금액은?">
<meta property="og:description" content="연 수익률 4·6·8·10%를 겹쳐 놓고 합계금액을 비교하세요.">
<meta property="og:url" content="https://yunhwon.github.io/Retirement-planning/rate-compare_v5.html">
<style>
:root{--c4:#1a8f5b;--c6:#8e44ad;--c8:#2457d6;--c10:#e07b00;--t4:#e3f4ec;--t6:#f1e6f7;--t8:#e6edfc;--t10:#fff0dc;
--bg:#f4f6fa;--card:#fff;--ink:#1b2430;--sub:#667385;--line:#e1e6ee;--accent:#2457d6;--accent2:#e6edfc;--btntxt:#fff;--bad:#c0392b;--tp:#eceff3}
@media (prefers-color-scheme:dark){:root{--c4:#4fd19a;--c6:#c08ae0;--c8:#7aa2ff;--c10:#ffb454;--t4:#17382a;--t6:#33213f;--t8:#1f2b46;--t10:#3a2a14;
--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--sub:#9aa5b5;--line:#2c3542;--accent:#7aa2ff;--accent2:#1f2b46;--btntxt:#0b1220;--bad:#ff8a7a;--tp:#272d37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:4px 0 6px}
h2{font-size:16px;margin:0 0 10px}
.lead{margin:0 0 16px;color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:13px;color:var(--sub)}
.inp{display:flex;align-items:center;margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.inp input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;font-weight:600;padding:10px 0;outline:0;text-align:right}
.inp em{font-style:normal;color:var(--sub);margin-left:6px;font-size:14px}
select{width:100%;margin-top:4px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
details{margin-top:12px;font-size:14px}
summary{cursor:pointer;color:var(--accent)}
.opts{display:grid;gap:10px;margin-top:10px}
.err{color:var(--bad);font-size:13px;margin:10px 0 0}
.err:empty{display:none}
.tog{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tog .lb{font-size:13px;color:var(--sub);align-self:center;margin-right:4px}
.chip{border:2px solid var(--line);background:var(--bg);color:var(--sub);font:inherit;font-weight:700;font-size:15px;padding:7px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent}
.chip[data-r="4"][aria-pressed="true"]{background:var(--c4)}
.chip[data-r="6"][aria-pressed="true"]{background:var(--c6)}
.chip[data-r="8"][aria-pressed="true"]{background:var(--c8)}
.chip[data-r="10"][aria-pressed="true"]{background:var(--c10)}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#0b1220}}
.chip:focus-visible{outline:3px solid var(--accent2)}
.dim{opacity:.35}
.lbl{font-size:13px;color:var(--sub)}
.big{font-size:clamp(26px,6vw,38px);font-weight:800;color:var(--c8);letter-spacing:-.5px;margin:2px 0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:10px}
.stats div{border-left:4px solid var(--line);padding-left:10px}
.stats span{display:block;font-size:12px;color:var(--sub)}
.stats b{font-size:16px}
.stats small{display:block;font-size:12px;color:var(--sub)}
#chart svg{width:100%;height:auto;display:block}
.axis{fill:var(--sub);font-size:11px}
.grd{stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke-width:2.5;stroke-linejoin:round}
.pr{fill:none;stroke:var(--sub);stroke-width:1.5;stroke-dasharray:5 4}
.vlab{font-size:11px;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.vl{stroke:var(--sub);stroke-width:1;stroke-dasharray:3 3;opacity:0}
.hv:hover .vl{opacity:1}
.band{fill:transparent}
.legend{font-size:13px;color:var(--sub);margin:4px 0 14px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin:0 6px 3px 14px;vertical-align:middle}
.legend i:first-child{margin-left:0}
.btn{width:100%;padding:13px 16px;border:0;border-radius:12px;background:var(--accent);color:var(--btntxt);font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tbl{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--accent2);color:var(--ink);font-weight:700;z-index:1}
thead tr:nth-child(2) th{top:28px}
th.g{text-align:center;color:#fff}
th:first-child,td:first-child{text-align:center}
tbody tr:nth-child(even) td{filter:brightness(.97)}
td.gl,th.gl{border-left:2px solid var(--sub)}
td.cP{background:var(--tp)}
.note{font-size:12px;color:var(--sub);margin:6px 2px 0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>
<body>
<main class="wrap">
<h1>수익률이 다르면 합계금액은?</h1>
<p class="lead">매달 같은 금액을 납입할 때, 연 수익률에 따라 합계금액이 얼마나 달라지는지 겹쳐서 비교합니다.</p>

<section class="card">
  <div class="grid">
    <label for="a">매월 납입액<span class="inp"><input id="a" inputmode="numeric" autocomplete="off" value="500"></span></label>
    <label for="c">투자 기간<span class="inp"><input id="c" inputmode="numeric" autocomplete="off" value="30"><em>년</em></span></label>
  </div>
  <div class="tog" role="group" aria-label="비교할 연 수익률">
    <span class="lb">연 수익률</span>
    <button type="button" class="chip" data-r="4" aria-pressed="false">4%</button>
    <button type="button" class="chip" data-r="6" aria-pressed="false">6%</button>
    <button type="button" class="chip" data-r="8" aria-pressed="true">8%</button>
    <button type="button" class="chip" data-r="10" aria-pressed="false">10%</button>
  </div>
  <details>
    <summary>세부 설정</summary>
    <div class="opts">
      <label for="t">납입 시점
        <select id="t"><option value="end">매월 말 (기본)</option><option value="begin">매월 초</option></select>
      </label>
      <label for="m">수익률 적용 방식
        <select id="m"><option value="nominal">연 수익률 ÷ 12 를 매달 적용 (기본)</option><option value="eff">연 실효 (1년 뒤 증가율 = 입력값)</option></select>
      </label>
    </div>
  </details>
  <p id="err" class="err" role="alert"></p>
</section>

<section class="card" id="res" aria-live="polite">
  <div class="lbl"><span id="yrs">30년</span> 후 합계금액</div>
  <div class="big" id="top">-</div>
  <div class="lbl" id="topsub"></div>
  <div class="stats" id="stats"></div>
  <div id="chart" style="margin-top:12px"></div>
  <div class="legend" id="legend"></div>
  <button type="button" id="dl" class="btn">엑셀로 다운로드 (서식·수식·차트 포함)</button>
</section>

<section class="card">
  <h2>연도별 내역</h2>
  <div class="tbl">
    <table>
      <thead id="thead"></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="note">표를 좌우로 밀어서 더 볼 수 있어요. 누적 납입은 수익률과 관계없이 같습니다. 위의 수익률 버튼으로 표에 넣을 열을 고를 수 있습니다.</p>
</section>
<p class="note">세전 기준이며 수수료·세금·물가 상승은 반영하지 않은 단순 시뮬레이션입니다. 실제 수익률은 매년 달라지므로 결과는 참고용이며 투자 권유가 아닙니다.</p>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var nf = new Intl.NumberFormat('ko-KR');
  var RATES = [4, 6, 8, 10], on = {4: false, 6: false, 8: true, 10: false}, state = null;
  function fmt0(x){ return nf.format(Math.round(x)); }
  function num(s){ return parseFloat(String(s).replace(/[,\s원%년]/g, '')); }
  function readInputs(){
    var A = num($('a').value), C = num($('c').value), e = '';
    if (!isFinite(A) || A <= 0) e = '매월 납입액을 0보다 큰 값으로 입력해 주세요.';
    else if (A > 1e10) e = '매월 납입액이 너무 큽니다.';
    else if (!isFinite(C) || C < 1 || C > 60 || Math.floor(C) !== C) e = '투자 기간은 1~60년 사이의 정수로 입력해 주세요.';
    return {A: A, C: C, e: e, timing: $('t').value, mode: $('m').value};
  }
  function rateOf(p, B){ return p.mode === 'nominal' ? B / 100 / 12 : Math.pow(1 + B / 100, 1 / 12) - 1; }
  function fv(p, B, years){
    var n = Math.round(years * 12), r = rateOf(p, B);
    if (n <= 0) return 0;
    var v = p.A * (Math.pow(1 + r, n) - 1) / r;
    return p.timing === 'begin' ? v * (1 + r) : v;
  }
  function sel(){ return RATES.filter(function(r){ return on[r]; }); }
  function build(p){
    var rows = [];
    for (var y = 0; y <= p.C; y++){
      var o = {y: y, dep: p.A * 12 * y};
      RATES.forEach(function(r){ o['t' + r] = fv(p, r, y); });
      rows.push(o);
    }
    return rows;
  }
  function chart(rows, p){
    var el = $('chart'), W = Math.max(300, Math.round(el.clientWidth || 700)), pl = 70, pr = 16, pt = 18, pb = 30, UNIT = 83, S = sel();
    var last = rows[rows.length - 1], n = rows.length - 1, iw = W - pl - pr;
    var raw8 = last.t8 || 1, rawAll = Math.max.apply(null, [8].concat(S).map(function(r){ return last['t' + r]; })) || 1;
    var mag = Math.pow(10, Math.floor(Math.log10(raw8 / 4))), f = raw8 / 4 / mag, stepN = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
    var kN = Math.ceil(rawAll / stepN - 1e-9), max = stepN * kN, ih = UNIT * kN, H = pt + pb + ih;
    function X(y){ return pl + iw * y / n; }
    function Y(v){ return pt + ih * (1 - v / max); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="연 수익률별 합계금액 선그래프">';
    for (var g = 0; g <= kN; g++){
      var v = stepN * g, yy = Y(v).toFixed(1);
      s += '<line class="grd" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + yy + '" y2="' + yy + '"/><text class="axis" text-anchor="end" x="' + (pl - 6) + '" y="' + (+yy + 4) + '">' + fmt0(v) + '</text>';
    }
    var step = Math.ceil(n / Math.max(3, Math.floor(iw / 60)));
    for (var y = 0; y <= n; y++) if (y % step === 0 || y === n) s += '<text class="axis" text-anchor="middle" x="' + X(y).toFixed(1) + '" y="' + (H - 8) + '">' + y + '년</text>';
    s += '<path class="pr" d="' + rows.map(function(r, i){ return (i ? 'L' : 'M') + X(r.y).toFixed(1) + ' ' + Y(r.dep).toFixed(1); }).join('') + '"/>';
    S.forEach(function(R){
      s += '<path class="ln" style="stroke:var(--c' + R + ')" d="' + rows.map(function(r, i){ return (i ? 'L' : 'M') + X(r.y).toFixed(1) + ' ' + Y(r['t' + R]).toFixed(1); }).join('') + '"/>';
    });
    var bw = iw / n;
    rows.forEach(function(r){
      var tip = r.y + '년차\n누적 납입 ' + fmt0(r.dep) + S.map(function(R){ return '\n연 ' + R + '% 합계 ' + fmt0(r['t' + R]) + ' (수익 ' + fmt0(r['t' + R] - r.dep) + ')'; }).join('');
      s += '<g class="hv"><title>' + tip + '</title><line class="vl" x1="' + X(r.y).toFixed(1) + '" x2="' + X(r.y).toFixed(1) + '" y1="' + pt + '" y2="' + (H - pb) + '"/><rect class="band" x="' + (X(r.y) - bw / 2).toFixed(1) + '" y="' + pt + '" width="' + bw.toFixed(1) + '" height="' + ih + '"/></g>';
    });
    var L = rows[n], lab = S.map(function(R){ return {R: R, y: Y(L['t' + R]), v: L['t' + R]}; }).sort(function(a, b){ return a.y - b.y; });
    for (var i = 1; i < lab.length; i++) if (lab[i].y - lab[i - 1].y < 14) lab[i].ly = lab[i - 1].ly !== undefined ? lab[i - 1].ly + 14 : lab[i - 1].y + 14;
    lab.forEach(function(o){
      var ly = o.ly !== undefined ? o.ly : o.y;
      s += '<circle cx="' + X(n).toFixed(1) + '" cy="' + o.y.toFixed(1) + '" r="4" style="fill:var(--c' + o.R + ')"/><text class="vlab" text-anchor="end" style="fill:var(--c' + o.R + ')" x="' + (X(n) - 8).toFixed(1) + '" y="' + (ly - 6).toFixed(1) + '">' + o.R + '% ' + fmt0(o.v) + '</text>';
    });
    $('chart').innerHTML = s + '</svg>';
  }
  function render(){
    var p = readInputs();
    $('err').textContent = p.e; $('dl').disabled = !!p.e;
    $('res').classList.toggle('dim', !!p.e);
    if (p.e) return;
    var rows = build(p), S = sel(), L = rows[p.C];
    state = {p: p, rows: rows, S: S};
    $('yrs').textContent = p.C + '년';
    var hi = S[S.length - 1];
    $('top').textContent = fmt0(L['t' + hi]);
    $('top').style.color = 'var(--c' + hi + ')';
    $('topsub').textContent = '연 ' + hi + '% 기준 (선택한 것 중 가장 높은 수익률)';
    $('stats').innerHTML = S.map(function(R){
      var t = L['t' + R], g = t - L.dep;
      return '<div style="border-left-color:var(--c' + R + ')"><span>연 ' + R + '%</span><b>' + fmt0(t) + '</b><small>수익 ' + fmt0(g) + ' (원금의 ' + (L.dep ? (g / L.dep * 100).toFixed(0) : 0) + '%)</small></div>';
    }).join('') + '<div><span>총 납입 원금</span><b>' + fmt0(L.dep) + '</b><small>수익률과 관계없이 같음</small></div>';
    chart(rows, p);
    $('legend').innerHTML = '<i style="background:var(--sub)"></i>누적 납입(점선)' + S.map(function(R){ return '<i style="background:var(--c' + R + ')"></i>연 ' + R + '%'; }).join('') + ' (선 위에 커서를 올리면 그해 금액이 보입니다)';
    $('thead').innerHTML = '<tr><th rowspan="2">연차</th><th rowspan="2" class="gl">누적 납입</th>' + S.map(function(R){ return '<th colspan="2" class="g gl" style="background:var(--c' + R + ')">연 ' + R + '%</th>'; }).join('') + '</tr>' +
      '<tr>' + S.map(function(R){ return '<th class="gl" style="background:var(--t' + R + ')">누적 수익</th><th style="background:var(--t' + R + ')">합계금액</th>'; }).join('') + '</tr>';
    $('rows').innerHTML = rows.slice(1).map(function(r){
      return '<tr><td>' + r.y + '년</td><td class="cP gl">' + fmt0(r.dep) + '</td>' + S.map(function(R){ return '<td class="gl" style="background:var(--t' + R + ')">' + fmt0(r['t' + R] - r.dep) + '</td><td style="background:var(--t' + R + ')">' + fmt0(r['t' + R]) + '</td>'; }).join('') + '</tr>';
    }).join('');
  }
  function download(blob, name){
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function exportCsv(){
    var s = state; if (!s) return;
    var h = ['연차', '누적 납입']; s.S.forEach(function(R){ h.push(R + '% 누적수익', R + '% 합계'); });
    var L = [h.join(',')];
    s.rows.slice(1).forEach(function(r){ var c = [r.y, r.dep]; s.S.forEach(function(R){ c.push((r['t' + R] - r.dep).toFixed(2), r['t' + R].toFixed(2)); }); L.push(c.join(',')); });
    download(new Blob(['﻿' + L.join('\r\n')], {type: 'text/csv;charset=utf-8'}), '수익률비교_v5.csv');
  }
  
  function colName(i){ var s = ''; while (i > 0){ var m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
  function esc(t){ return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function buildXlsx(s){
    var p = s.p, A = p.A, ny = p.C, rows = s.rows;
    var NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    var ST = {fonts: [], fills: [], borders: [], numFmts: [], xfs: [], dxfs: [], map: {}};
    function fontXml(o){ return '<font>' + (o.b ? '<b/>' : '') + (o.i ? '<i/>' : '') + '<sz val="' + (o.sz || 10) + '"/><color rgb="FF' + (o.c || '000000') + '"/><name val="Arial"/><family val="2"/></font>'; }
    function pick(arr, x){ var i = arr.indexOf(x); if (i < 0){ arr.push(x); i = arr.length - 1; } return i; }
    function fmtId(code){
      if (!code) return 0; if (code === '#,##0') return 3; if (code === '0.00%') return 10;
      var i = ST.numFmts.indexOf(code); if (i < 0){ ST.numFmts.push(code); i = ST.numFmts.length - 1; } return 164 + i;
    }
    ST.fills.push('<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>');
    ST.borders.push('<border><left/><right/><top/><bottom/><diagonal/></border>');
    ST.fonts.push(fontXml({}));
    function xf(o){
      o = o || {};
      var key = JSON.stringify(o); if (ST.map[key] !== undefined) return ST.map[key];
      var fo = pick(ST.fonts, fontXml(o)), fi = 0, bo = 0;
      if (o.fill) fi = pick(ST.fills, '<fill><patternFill patternType="solid"><fgColor rgb="FF' + o.fill + '"/><bgColor indexed="64"/></patternFill></fill>');
      if (o.bd) bo = pick(ST.borders, '<border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom><diagonal/></border>');
      var al = (o.h || o.v || o.wrap) ? '<alignment' + (o.h ? ' horizontal="' + o.h + '"' : '') + (o.v ? ' vertical="' + o.v + '"' : '') + (o.wrap ? ' wrapText="1"' : '') + '/>' : '';
      var x = '<xf numFmtId="' + fmtId(o.fmt) + '" fontId="' + fo + '" fillId="' + fi + '" borderId="' + bo + '" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"' + (al ? ' applyAlignment="1">' + al + '</xf>' : '/>');
      ST.xfs.push(x); ST.map[key] = ST.xfs.length - 1; return ST.map[key];
    }
    xf({});
    function dxf(font, fill){

      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="' + ST.xfs.length + '">' + ST.xfs.join('') + '</cellXfs>' +
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles><dxfs count="' + ST.dxfs.length + '">' + ST.dxfs.join('') + '</dxfs></styleSheet>';

    var zip = new JSZip();
    zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      sheets.map(function(x, i){ return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; }).join('') +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>' +
      '<Override PartName="/xl/charts/chart1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/></Types>');
    zip.file('_rels/.rels', rels([['rId1', 'officeDocument', 'xl/workbook.xml']]));
    zip.file('xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="' + NS + '" xmlns:r="' + RNS + '"><bookViews><workbookView activeTab="0"/></bookViews><sheets>' +
      sheets.map(function(x, i){ return '<sheet name="' + x.name + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>'; }).join('') + '</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>');
    zip.file('xl/_rels/workbook.xml.rels', rels(sheets.map(function(x, i){ return ['rId' + (i + 1), 'worksheet', 'worksheets/sheet' + (i + 1) + '.xml']; }).concat([['rId' + (sheets.length + 1), 'styles', 'styles.xml']])));
    zip.file('xl/styles.xml', styles);
    sheets.forEach(function(x, i){ zip.file('xl/worksheets/sheet' + (i + 1) + '.xml', x.xml()); });
    zip.file('xl/worksheets/_rels/sheet1.xml.rels', rels([['rId1', 'drawing', '../drawings/drawing1.xml']]));
    zip.file('xl/drawings/drawing1.xml', drawing(0, 18, 7, 18 + chartRows));
    zip.file('xl/drawings/_rels/drawing1.xml.rels', rels([['rId1', 'chart', '../charts/chart1.xml']]));
    zip.file('xl/charts/chart1.xml', chart1);
    return zip.generateAsync({type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  function exportXlsx(){
    var s = state; if (!s) return;
    if (!window.JSZip){ exportCsv(); alert('엑셀 라이브러리를 불러오지 못해 CSV 파일로 내려받았습니다. (인터넷 연결을 확인해 주세요)'); return; }
    buildXlsx(s).then(function(blob){ download(blob, '수익률비교_v5.xlsx'); });
  }

  $('dl').addEventListener('click', exportXlsx);
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(b){
    b.addEventListener('click', function(){
      var r = +b.getAttribute('data-r'), cnt = sel().length;
      if (on[r] && cnt === 1) return;
      on[r] = !on[r]; b.setAttribute('aria-pressed', on[r] ? 'true' : 'false'); render();
    });
  });
  ['a', 'c'].forEach(function(id){ $(id).addEventListener('input', render); });
  ['t', 'm'].forEach(function(id){ $(id).addEventListener('change', render); });
  $('a').addEventListener('input', function(e){
    var el = e.target, d = el.value.replace(/\D/g, '').slice(0, 11), fromEnd = el.value.length - (el.selectionStart || 0);
    el.value = d ? nf.format(+d) : '';
    var pos = Math.max(0, el.value.length - fromEnd); try { el.setSelectionRange(pos, pos); } catch (x) {}
  });
  var rz = null, lastW = 0;
  window.addEventListener('resize', function(){ clearTimeout(rz); rz = setTimeout(function(){ var w = $('chart').clientWidth; if (state && w && Math.abs(w - lastW) > 8){ lastW = w; chart(state.rows, state.p); } }, 150); });
  render(); lastW = $('chart').clientWidth;
})();
</script>
