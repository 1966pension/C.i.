<!doctype html>
<!-- 선택 페이지 (내용 버전 v4). 파일명은 index.html 고정, 아래 세 페이지는 저장소에서 가장 높은 버전을 자동으로 찾아 연결합니다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>적립식 투자 계산기 모음</title>
<meta name="description" content="매월 납입액·연 수익률·기간으로 예상 금액을 계산합니다. 심플, 컴플렉스, 늦게 시작 비교 중에서 고르세요.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:title" content="적립식 투자 계산기 모음">
<meta property="og:description" content="심플 · 컴플렉스 · 늦게 시작 비교 중에서 골라 쓰세요.">
<meta property="og:url" content="https://yunhwon.github.io/Retirement-planning/index.html">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2430;--sub:#667385;--line:#e1e6ee;--accent:#2457d6;--accent2:#e6edfc}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--sub:#9aa5b5;--line:#2c3542;--accent:#7aa2ff;--accent2:#1f2b46}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 6px}
.lead{margin:0 0 20px;color:var(--sub);font-size:14px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
a.card:hover,a.card:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2);outline:0}
.t{font-size:17px;font-weight:700;color:var(--accent)}
.d{font-size:13.5px;color:var(--sub);margin-top:3px}
.note{font-size:12px;color:var(--sub);margin-top:18px}
</style>
</head>
<body>
<main class="wrap">
<h1>적립식 투자 계산기</h1>
<p class="lead">매달 일정 금액을 납입하고 연 수익률로 불렸을 때 얼마가 되는지 계산합니다. 필요한 것을 고르세요.</p>
<a class="card" id="simple" href="simple_v5.html"><div class="t">심플 →</div><div class="d">납입액·수익률·기간만 넣으면 결과와 연도별 차트, 엑셀 다운로드까지.</div></a>
<a class="card" id="complex" href="complex_v7.html"><div class="t">컴플렉스 →</div><div class="d">Turning Point 표시(수익이 납입을 넘는 시점 등), 누적 납입·수익 차트와 상세 엑셀.</div></a>
<a class="card" id="late-start" href="late-start_v4.html"><div class="t">시작을 늦추면? →</div><div class="d">복리에서는 시간이 무기. 늦게 시작한 만큼 합계금액이 얼마나 줄어드는지 비교.</div></a>
<p class="note">세전 기준이며 수수료·세금·물가 상승은 반영하지 않은 단순 시뮬레이션입니다. 결과는 참고용이며 투자 권유가 아닙니다.</p>
</main>
<script>
/* 같은 저장소에서 simple_v숫자.html 등 가장 높은 버전을 찾아 링크를 바꿉니다.
   찾지 못하면(오프라인·요청 제한 등) 위에 적힌 기본 링크가 그대로 쓰입니다. */
(function(){
  var API = 'https://api.github.com/repos/yunhwon/Retirement-planning/contents/';
  function apply(names){
    ['simple','complex','late-start'].forEach(function(k){
      var best = -1, file = null, re = new RegExp('^' + k + '_v(\\d+)\\.html$');
      names.forEach(function(n){ var m = re.exec(n); if (m && +m[1] > best){ best = +m[1]; file = n; } });
      if (file) document.getElementById(k).setAttribute('href', file);
    });
  }
  try { var c = JSON.parse(sessionStorage.getItem('rp_files') || 'null'); if (c && Date.now() - c.t < 600000){ apply(c.n); return; } } catch (e) {}
  if (!window.fetch) return;
  fetch(API).then(function(r){ return r.ok ? r.json() : Promise.reject(); }).then(function(list){
    var names = list.map(function(f){ return f.name; });
    apply(names);
    try { sessionStorage.setItem('rp_files', JSON.stringify({t: Date.now(), n: names})); } catch (e) {}
  }).catch(function(){});
})();
</script>
</body>
</html>
